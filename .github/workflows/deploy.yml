name: 🚀 Build and Deploy Lovable Site to SiteGround

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    name: 🎉 Build & SFTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔨 Install Dependencies
        run: npm install

      - name: 📦 Build Project
        run: npm run build

      - name: 📂 Sync files to SiteGround via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          ssh_private_key: ${{ secrets.SFTP_SSH_KEY }} # Swapped out password for the secure SSH key
          port: ${{ secrets.SFTP_PORT }}
          local_path: './dist/*' 
          remote_path: '/public_html' 
          delete_remote_files: true 
