name: 🚀 Build and Deploy Lovable Site to SiteGround

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: 🎉 Build & SFTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔨 Install Dependencies
        run: npm install

      - name: 📦 Build Project
        run: npm run build

      - name: 🔍 Check Build Output
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Files in project:"
          ls -la

          echo ""
          echo "Looking for build directories:"
          find . -maxdepth 3 -type d \( -name "dist" -o -name "build" \) -print

          echo ""
          echo "Contents of dist if it exists:"
          ls -la dist 2>/dev/null || true

      - name: 📂 Deploy files to SiteGround via Rsync
        env:
          SSH_KEY: ${{ secrets.SFTP_SSH_KEY }}
          HOST: ${{ secrets.SFTP_SERVER }}
          USER: ${{ secrets.SFTP_USERNAME }}
          PORT: ${{ secrets.SFTP_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts

          rsync -avz --delete \
            -e "ssh -p $PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./dist/ \
            "$USER@$HOST:/home/customer/www/helixlogistictt.com/public_html/"
