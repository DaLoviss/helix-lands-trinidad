name: 🚀 Build and Deploy Lovable Site to SiteGround

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    name: 🎉 Build & SFTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔨 Install Dependencies
        run: npm install

      - name: 📦 Build Project
        run: npm run build

      - name: 📂 Deploy files to SiteGround via SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SFTP_SSH_KEY }}
          ARGS: "-avz --delete"
          REMOTE_HOST: ${{ secrets.SFTP_SERVER }}
          PORT: ${{ secrets.SFTP_PORT }}
          REMOTE_USER: ${{ secrets.SFTP_USERNAME }}
          SOURCE: "dist/"
          # SiteGround absolute path format uses /home/customer/www/hostname/public_html
          TARGET: "/home/customer/www/gtxm1355.siteground.biz/public_html/"
