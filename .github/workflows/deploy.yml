name: Build & Deploy to SiteGround

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy Website
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Get the latest code from GitHub
      # --------------------------------------------------
      - name: Get latest code
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Set up Node.js
      # --------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
    

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install Dependencies
        run: npm install

      # --------------------------------------------------
      # 4. Build the website
      # --------------------------------------------------
      - name: Build Project
        run: npm run build

      # --------------------------------------------------
      # 5. Confirm the static website was generated
      # --------------------------------------------------
      - name: 🔍 Verify Static Output
        run: |
       echo "Static output:"
       find .output/public -maxdepth 4 -type f -print | sort

       echo
       echo "HTML pages:"
       find .output/public -type f -name '*.html' -print | sort

       echo
       echo "Checking for homepage..."

       if [ ! -f ".output/public/index.html" ]; then
         echo "ERROR: .output/public/index.html was NOT generated."
         echo "The deployment will NOT continue."
         exit 1
      fi

      echo "Homepage index.html found."

      echo
      echo "Checking other pages..."

      for page in \
        ".output/public/why-helix/index.html" \
        ".output/public/serviceable-areas/index.html" \
        ".output/public/contact/index.html"
      do
        if [ ! -f "$page" ]; then
        echo "ERROR: Missing $page"
        exit 1
       fi
     done

     echo
     echo "All expected HTML pages were generated successfully."

      # --------------------------------------------------
      # 6. Start SSH agent with SiteGround private key
      # --------------------------------------------------
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SITEGROUND_SSH_PRIVATE_KEY }}

      # --------------------------------------------------
      # 7. Add SiteGround to known hosts
      # --------------------------------------------------
      - name: Add SiteGround host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan -p 18765 "${{ secrets.SITEGROUND_HOST }}" \
            >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

      # --------------------------------------------------
      # 8. Test SSH connection
      # --------------------------------------------------
      - name: Test SiteGround SSH connection
        run: |
          ssh \
            -p 18765 \
            "${{ secrets.SITEGROUND_USER }}@${{ secrets.SITEGROUND_HOST }}" \
            "echo 'SSH connection to SiteGround successful'"

      # --------------------------------------------------
      # 9. Deploy website
      # --------------------------------------------------
      - name: Deploy files to SiteGround
        run: |
          rsync -avz --delete \
            -e "ssh -p 18765" \
            .output/public/ \
            "${{ secrets.SITEGROUND_USER }}@${{ secrets.SITEGROUND_HOST }}:/home/customer/www/helixlogisticstt.com/public_html/"

      # --------------------------------------------------
      # 10. Verify deployment
      # --------------------------------------------------
      - name: Verify SiteGround deployment
        run: |
          ssh \
            -p 18765 \
            "${{ secrets.SITEGROUND_USER }}@${{ secrets.SITEGROUND_HOST }}" \
            "echo 'Files currently in public_html:' && ls -la /home/customer/www/helixlogisticstt.com/public_html/" 
