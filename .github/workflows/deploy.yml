name: 🚀 Build and Deploy Lovable Site to SiteGround

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    name: 🎉 Build & SFTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔨 Install Dependencies
        run: npm install

      - name: 📦 Build Project
        run: npm run build

      - name: 🔑 Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          # Using a heredoc structure preserves the exact newlines needed for the OpenSSH key format
          cat << 'EOF' > ~/.ssh/id_rsa
          ${{ secrets.SFTP_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SFTP_PORT }} ${{ secrets.SFTP_SERVER }} >> ~/.ssh/known_hosts

      - name: 📂 Deploy files to SiteGround via Rsync
        run: |
          rsync -e "ssh -p ${{ secrets.SFTP_PORT }} -i ~/.ssh/id_rsa" -avz --delete ./dist/ ${{ secrets.SFTP_USERNAME }}@${{ secrets.SFTP_SERVER }}:/home/${{ secrets.SFTP_USERNAME }}/public_html/
