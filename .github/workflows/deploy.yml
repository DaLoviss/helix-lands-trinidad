name: Deploy Helix Logistics to SiteGround

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy Website
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Get the latest code from GitHub
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Set up Node.js
      # --------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # --------------------------------------------------
      # 3. Install project dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm install

      # --------------------------------------------------
      # 4. Build the website
      # --------------------------------------------------
      - name: Build website
        run: npm run build

      # --------------------------------------------------
      # 5. Verify that the static website was generated
      # --------------------------------------------------
      - name: Check build output
        run: |
          echo "========================================"
          echo "BUILD OUTPUT"
          echo "========================================"

          if [ ! -d ".output/public" ]; then
            echo "ERROR: .output/public does not exist."
            echo "The build did not create the expected static output."
            exit 1
          fi

          echo ""
          echo "Files generated:"
          find .output/public -maxdepth 4 -type f -print | sort

          echo ""
          echo "========================================"
          echo "HTML FILES"
          echo "========================================"

          find .output/public -type f -name "*.html" -print | sort

          echo ""
          echo "========================================"
          echo "CHECKING HOMEPAGE"
          echo "========================================"

          if [ ! -f ".output/public/index.html" ]; then
            echo "ERROR: .output/public/index.html was NOT generated."
            echo ""
            echo "The deployment has been stopped."
            echo "Your TanStack configuration must generate a static homepage."
            exit 1
          fi

          echo "SUCCESS: Homepage index.html found."

          echo ""
          echo "========================================"
          echo "CHECKING OTHER PAGES"
          echo "========================================"

          if [ ! -f ".output/public/why-helix/index.html" ]; then
            echo "ERROR: Missing why-helix/index.html"
            exit 1
          fi

          if [ ! -f ".output/public/serviceable-areas/index.html" ]; then
            echo "ERROR: Missing serviceable-areas/index.html"
            exit 1
          fi

          if [ ! -f ".output/public/contact/index.html" ]; then
            echo "ERROR: Missing contact/index.html"
            exit 1
          fi

          echo "SUCCESS: All expected HTML pages were generated."

          echo ""
          echo "========================================"
          echo "BUILD VERIFICATION COMPLETE"
          echo "========================================"

      # --------------------------------------------------
      # 6. Start SSH agent with SiteGround private key
      # --------------------------------------------------
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SITEGROUND_SSH_PRIVATE_KEY }}

      # --------------------------------------------------
      # 7. Add SiteGround to known hosts
      # --------------------------------------------------
      - name: Add SiteGround host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan -p 18765 "${{ secrets.SITEGROUND_HOST }}" >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

      # --------------------------------------------------
      # 8. Test SSH connection
      # --------------------------------------------------
      - name: Test SiteGround SSH connection
        run: |
          ssh \
            -p 18765 \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.SITEGROUND_USER }}@${{ secrets.SITEGROUND_HOST }}" \
            "echo 'SSH connection to SiteGround successful.'"

      # --------------------------------------------------
      # 9. Make sure the SiteGround folder exists
      # --------------------------------------------------
      - name: Prepare SiteGround folder
        run: |
          ssh \
            -p 18765 \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.SITEGROUND_USER }}@${{ secrets.SITEGROUND_HOST }}" \
            "mkdir -p /home/customer/www/helixlogisticstt.com/public_html"

      # --------------------------------------------------
      # 10. Upload the static website
      # --------------------------------------------------
      - name: Deploy files to SiteGround
        run: |
          rsync -avz --delete \
            -e "ssh -p 18765 -o StrictHostKeyChecking=yes" \
            .output/public/ \
            "${{ secrets.SITEGROUND_USER }}@${{ secrets.SITEGROUND_HOST }}:/home/customer/www/helixlogisticstt.com/public_html/"

      # --------------------------------------------------
      # 11. Verify files exist on SiteGround
      # --------------------------------------------------
      - name: Verify SiteGround deployment
        run: |
          echo "========================================"
          echo "VERIFYING SITEGROUND DEPLOYMENT"
          echo "========================================"

          ssh \
            -p 18765 \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.SITEGROUND_USER }}@${{ secrets.SITEGROUND_HOST }}" \
            "echo 'Files in public_html:' && find /home/customer/www/helixlogisticstt.com/public_html -maxdepth 3 -type f | sort"

          echo ""
          echo "Checking homepage..."

          ssh \
            -p 18765 \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.SITEGROUND_USER }}@${{ secrets.SITEGROUND_HOST }}" \
            "test -f /home/customer/www/helixlogisticstt.com/public_html/index.html"

          echo ""
          echo "SUCCESS: index.html exists on SiteGround."
          echo "Deployment completed successfully."
