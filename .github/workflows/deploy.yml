name: 🚀 Build and Deploy Lovable Site to SiteGround

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    name: 🎉 Build & SFTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔨 Install Dependencies
        run: npm install

      - name: 📦 Build Project
        run: npm run build

      - name: 📂 Deploy files to SiteGround via Rsync
        env:
          SSH_KEY: ${{ secrets.SFTP_SSH_KEY }}
          HOST: ${{ secrets.SFTP_SERVER }}
          USER: ${{ secrets.SFTP_USERNAME }}
          PORT: ${{ secrets.SFTP_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts

          rsync -avz --delete \
            -e "ssh -p $PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./dist/ \
            "$USER@$HOST:/home/customer/www/gtxm1355.siteground.biz/public_html/"
